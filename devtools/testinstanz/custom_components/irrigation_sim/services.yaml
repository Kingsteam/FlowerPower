open_for:
  fields:
    zone:
      required: true
      selector:
        number: {min: 1, max: 10, mode: box}
    duration:
      required: true
      selector:
        number: {min: 1, max: 14400, unit_of_measurement: s, mode: box}
set_fault:
  fields:
    zone:
      required: true
      selector:
        number: {min: 1, max: 10, mode: box}
    fault:
      required: true
      selector:
        select:
          options: [none, leak, shortage, burst, clogged, stuck_open, dripping, unreachable]
set_battery:
  fields:
    zone:
      required: true
      selector:
        number: {min: 1, max: 10, mode: box}
    level:
      required: true
      selector:
        number: {min: 0, max: 100, unit_of_measurement: "%"}
